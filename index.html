<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f8" id="themeColor">
<meta name="description" content="1인 기업·프리랜서를 위한 생활 & 업무 매니저">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOL MANAGER">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SOL MANAGER</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* ===== Stellar Charm 토큰 — Dawn(낮) 기본, Midnight(밤) ===== */
:root{
  --bg:#fff6f8; --surface:#fffbf2; --surface-raised:#ffffff;
  --pink-100:#ffe4ec; --pink-200:#ffc9d9; --pink-300:#f9a3bf;
  --border:#f3c6d4; --border-control:#c8608c;
  --rose-500:#c23f76; --rose-600:#a8335f; --rose-ink:#9e2f5e; --on-primary:#ffffff;
  --ink:#4a2236; --ink-muted:#7d4a65;
  --star-200:#fff1b8; --star-400:#ffd86b; --on-star:#4a2236;
  --gold-500:#d9a441; --gold-text:#8f6516;
  --lilac-200:#ece2fb; --lilac-400:#b9a2ec; --lilac-text:#6b4fb0;
  --success:#22766c; --success-tint:#dff3ef; --warning:#8f6516; --danger:#c0304f; --danger-tint:#ffe1e6;
  --focus:#9e2f5e; --icon-stroke:#9e2f5e;
  --icon-fill-star:#ffd86b; --icon-fill-pink:#ffc9d9; --icon-fill-lilac:#dccbf7; --icon-fill-wing:#ffffff;
  --shadow-glow:0 6px 18px rgba(194,63,118,.16); --shadow-star:0 0 0 4px rgba(255,216,107,.45);
  --font-display:"Gowun Batang","Noto Serif KR",serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-spell:"Cinzel","Gowun Batang",serif;
  color-scheme:light;
}
:root[data-theme="midnight"]{
  --bg:#241726; --surface:#2e1d31; --surface-raised:#3a2540;
  --pink-100:#4a2a44; --pink-200:#6b3a5e; --pink-300:#a85584;
  --border:#5a3552; --border-control:#c27aa3;
  --rose-500:#f28bb5; --rose-600:#ffa8ca; --rose-ink:#ffc2d8; --on-primary:#3a1028;
  --ink:#fbeef3; --ink-muted:#d4b3c4;
  --star-200:#4d3f1c; --star-400:#ffd86b; --on-star:#3a1028;
  --gold-500:#e8bb5c; --gold-text:#f5d28a;
  --lilac-200:#3d3058; --lilac-400:#b9a2ec; --lilac-text:#cdbaf5;
  --success:#6fd3c2; --success-tint:#1f3a37; --warning:#f5d28a; --danger:#ff8fa6; --danger-tint:#4a1f2a;
  --focus:#ffd86b; --icon-stroke:#ffc2d8;
  --icon-fill-star:#d9a441; --icon-fill-pink:#8a3a66; --icon-fill-lilac:#5d4a8a; --icon-fill-wing:#4a2a44;
  --shadow-glow:0 6px 22px rgba(0,0,0,.45); --shadow-star:0 0 0 4px rgba(255,216,107,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/24px var(--font-body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));transition:background .3s}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.spell{font-family:var(--font-spell);font-weight:700;letter-spacing:.14em;font-size:12px;line-height:16px;text-transform:uppercase}
.sc-icon{display:inline-block;flex:none;vertical-align:middle;stroke:var(--icon-stroke)}
main{max-width:640px;margin:0 auto;padding:16px 16px 24px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 20px}
header.top h1{margin:2px 0 0;font:700 24px/32px var(--font-display);letter-spacing:-.01em}
.brand{color:var(--gold-text)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;line-height:18px;border:1px solid var(--border);background:var(--pink-100);color:var(--rose-ink);white-space:nowrap}
.chip.accent{background:var(--pink-100);color:var(--rose-ink)}
.chip.ok{background:var(--success-tint);color:var(--success);border-color:transparent}
.chip.warn{background:var(--star-200);color:var(--warning);border-color:transparent}
.chip.bad{background:var(--danger-tint);color:var(--danger);border-color:transparent}
.chip.lilac{background:var(--lilac-200);color:var(--lilac-text);border-color:transparent}
.chip .sc-icon{stroke:currentColor}

/* 카드 — 골드 안쪽 프레임 */
.card{position:relative;background:var(--surface-raised);border:1.5px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-glow)}
.card::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold-500);border-radius:15px;pointer-events:none;opacity:.55}
.card.hero{border-color:var(--gold-500);box-shadow:var(--shadow-star),var(--shadow-glow)}
.spark{position:absolute;width:14px;height:14px;fill:var(--star-400);stroke:var(--gold-500);stroke-width:1.5}
.spark.tl{top:-7px;left:18px}.spark.br{bottom:-7px;right:18px}
.card h2{margin:0 0 12px;font:700 17px/24px var(--font-display);display:flex;align-items:center;gap:8px}
.card h2 .hint{margin-left:auto;font:400 12px/16px var(--font-body);color:var(--ink-muted)}
.card h2 > .btn{margin-left:auto}
.muted{color:var(--ink-muted);font-size:13px;line-height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-bottom:0}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--surface-raised);border:1.5px solid var(--border-control);border-radius:12px;padding:9px 12px;width:100%;min-width:0;outline:none;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-muted);opacity:.8}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:2px}
textarea{resize:vertical;min-height:64px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--pink-300);border-radius:999px;padding:8px 16px;background:var(--pink-200);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rose-500);border-color:transparent;color:var(--on-primary);box-shadow:var(--shadow-glow)}
.btn.primary .sc-icon{stroke:currentColor}
.btn.ghost{background:transparent;border-color:transparent;color:var(--rose-ink);padding:6px 10px}
.btn.sm{padding:5px 12px;font-size:13px;line-height:18px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.check{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:1.5px solid var(--border-control);border-radius:6px;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface-raised)}
.check:checked{background:var(--rose-500);border-color:var(--rose-500)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--on-primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t3 input[type=text]{background:transparent;padding:8px 4px;border-radius:0;border:0;border-bottom:1px solid var(--border)}
.t3 input[type=text]:focus{outline:none;border-bottom-color:var(--rose-500)}
.t3 .done input[type=text]{text-decoration:line-through;color:var(--ink-muted)}
.t3 .row{margin-bottom:4px}

.big{font:700 30px/36px var(--font-display);letter-spacing:-.01em}
.bar{height:8px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--rose-500);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--star-400)}

.toggle{width:100%;padding:11px;border-radius:999px;border:1.5px dashed var(--border-control);background:transparent;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.toggle.on{border:1.5px solid var(--gold-500);background:var(--star-200);color:var(--warning);box-shadow:var(--shadow-star)}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.moods button{border:1.5px solid var(--border);background:var(--surface-raised);border-radius:16px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink)}
.moods button b{font:700 18px/24px var(--font-display)}
.moods button span{font-size:11px;line-height:16px;color:var(--ink-muted)}
.moods button.on{background:var(--rose-500);border-color:var(--rose-500);color:var(--on-primary)}
.moods button.on span{color:inherit}

.care{background:var(--lilac-200);border-color:transparent}
.care::before{border-color:var(--lilac-400)}
.care h2{color:var(--lilac-text)}
.care .item{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--ink)}
.care .muted{color:var(--ink)}

.dstrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:4px 16px 8px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dcard{flex:none;min-width:150px;max-width:210px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:10px 14px}
.dcard .d{font:700 20px/28px var(--font-spell);letter-spacing:.06em;color:var(--rose-ink)}
.dcard .t{font-size:12px;line-height:18px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard.hot{border-color:var(--danger);background:var(--danger-tint)}
.dcard.hot .d{color:var(--danger)}
.dcard.hot .t{color:var(--ink)}

.list .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.list .li:first-child{border-top:0}
.tag{font-size:11px;line-height:16px;padding:2px 8px;border-radius:999px;background:var(--lilac-200);color:var(--lilac-text)}
.proj{cursor:pointer}
.proj .ttl{font:700 16px/24px var(--font-display)}
.proj .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pbody{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);cursor:default}
.pbody label{display:block;font-size:12px;color:var(--ink-muted);margin:10px 0 4px}
.group-h{margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--gold-text);font:700 14px/20px var(--font-display)}
.group-h .num{font:400 12px var(--font-body);color:var(--ink-muted)}
.banner{padding:10px 14px;border-radius:12px;background:var(--star-200);color:var(--warning);font-size:13px;margin-bottom:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--ink-muted)}
.stat .v{font:700 22px/28px var(--font-display)}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .b{fill:var(--rose-500)}
svg.chart .b.low{fill:var(--lilac-400)}
svg.chart .b.ok{fill:var(--star-400);stroke:var(--gold-500);stroke-width:1}
svg.chart .gl{stroke:var(--gold-500);stroke-dasharray:3 3;stroke-width:1}
svg.chart .lbl{fill:var(--ink-muted);font-size:9px;font-family:var(--font-body)}
svg.chart .empty{fill:var(--border)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1.5px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:16px;color:var(--ink-muted);cursor:pointer}
nav.tabs button .sc-icon{stroke:var(--ink-muted)}
nav.tabs button .ico{padding:2px 14px;border-radius:999px;display:grid;place-items:center}
nav.tabs button.on{color:var(--rose-ink)}
nav.tabs button.on .ico{background:var(--pink-100)}
nav.tabs button.on .sc-icon{stroke:var(--icon-stroke)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--rose-500);color:var(--on-primary);padding:8px 18px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow-glow);display:flex;gap:6px;align-items:center}
.toast.show{opacity:1}
details summary{cursor:pointer;color:var(--rose-ink);font-size:13px}
.empty-note{color:var(--ink-muted);font-size:13px;padding:6px 0}
.seg{display:flex;gap:4px;background:var(--pink-100);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:13px;color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--rose-500);color:var(--on-primary)}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* ===== SOL MANAGER — 저장은 localStorage 한 키(JSON 문서 S) ===== */
const LS = "solmanager.v1";
const OLD_LS = "solent.v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TK = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const between = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5); // b - a (일)
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return `${t.getUTCFullYear()}-W${pad(Math.ceil(((t - y0) / 864e5 + 1) / 7))}`;
}
function weekDays(ref) { // 월~일
  const d = parseD(ref); const off = (d.getDay() + 6) % 7; const mon = addDays(ref, -off);
  return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
}
const steps = arr => arr.map(t => ({ id: uid(), t, done: false }));

function seed() {
  return {
    v: 1,
    settings: { name: "SOL", writeGoal: 2000, wage: 0, eveningHour: 18, theme: "time" },
    days: {},
    projects: [
      { id: uid(), title: "던전에도 근로기준법이 적용됩니다", type: "창작", status: "focus", deadline: "2026-11-08",
        goal: "대원 웹소설 공모전 제출 (현대 판타지)", note: "", steps: steps(["시놉시스 최종본 확정", "원고 퇴고", "제출 양식·분량 확인", "제출"]) },
      { id: uid(), title: "바다 밑 하루", type: "창작", status: "focus", deadline: "2026-11-08",
        goal: "SF스토리 공모전 AI영상 부문 제출 — 제출하면 영상 작업은 끝", note: "", steps: steps(["남은 컷 생성", "편집·자막·사운드", "최종 렌더", "제출"]) },
      { id: uid(), title: "현대로맨스 원고 (계약 출판사)", type: "창작", status: "next", deadline: "",
        goal: "출판사 원고 요청 대응", note: "남주: 컨벤션·MICE 업계 / 여주: 영어 통역 프리랜서", steps: steps(["인물·관계 설정", "시놉시스", "원고 집필", "출판사 제출"]) },
      { id: uid(), title: "나가주세요, 제발!", type: "창작", status: "next", deadline: "",
        goal: "25~30화 비축 → 플랫폼 연재·투베 도전 → 출판사 컨택, 선인세", note: "", steps: steps(["25화까지 비축", "30화까지 비축", "플랫폼 연재 시작", "투베 진입", "출판사 컨택"]) },
      { id: uid(), title: "브런치북 2막", type: "창작", status: "wait", deadline: "",
        goal: "공모전 제출 완료 · 2027년 2월 발표", note: "", steps: [] },
      { id: uid(), title: "캐릭터·브랜딩", type: "부업", status: "hold", deadline: "",
        goal: "후순위 — 웹소설 일정이 끝난 뒤 다시 보기", note: "부캉이 · 부산 개복치 · 브랜딩 스튜디오", steps: [] },
      { id: uid(), title: "그 외 AI 영상", type: "창작", status: "hold", deadline: "",
        goal: "당분간 제작하지 않음", note: "환영관 · 하와이 스낵바 등", steps: [] },
    ],
    chores: [
      { id: uid(), t: "방 청소", every: 7, last: "" },
      { id: uid(), t: "빨래", every: 4, last: "" },
      { id: uid(), t: "분리수거·쓰레기", every: 4, last: "" },
      { id: uid(), t: "장보기", every: 7, last: "" },
      { id: uid(), t: "침구 세탁", every: 14, last: "" },
      { id: uid(), t: "화장실 청소", every: 10, last: "" },
    ],
    routines: [
      { id: uid(), t: "밖에 나가서 10분 걷기" },
      { id: uid(), t: "샤워하고 옷 갈아입기" },
      { id: uid(), t: "물 한 컵, 끼니 한 번 제대로 먹기" },
      { id: uid(), t: "오늘 글은 메모 3줄만 — 그걸로 충분" },
      { id: uid(), t: "편한 사람에게 메시지 하나 보내기" },
      { id: uid(), t: "폰 내려놓고 일찍 눕기" },
    ],
    shifts: [], ideas: [], reviews: {},
  };
}

let S;
function load() {
  try { const raw = localStorage.getItem(LS); S = raw ? JSON.parse(raw) : seed(); }
  catch (e) { S = seed(); }
  const base = seed();
  for (const k of Object.keys(base)) if (S[k] === undefined) S[k] = base[k];
  S.settings = Object.assign({}, base.settings, S.settings);
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("저장 실패 — 백업을 내려받아 두세요"); } }
function day(k = TK()) {
  if (!S.days[k]) S.days[k] = { top3: [{ t: "", done: false }, { t: "", done: false }, { t: "", done: false }], ex: { done: false, min: "" }, mood: null, note: "", write: [], care: [] };
  return S.days[k];
}
const peek = k => S.days[k];
let toastT;
function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600); }

/* ===== 상태 ===== */
let tab = "today";
let openP = null;
const STATUS = { focus: "집중", next: "다음", wait: "결과 대기", hold: "보류", done: "완료" };
const STATUS_CHIP = { focus: "accent", next: "", wait: "ok", hold: "", done: "ok" };

function bars(vals, max, opt = {}) {
  const n = vals.length, W = 300, H = 92, top = 6, bh = 66, gap = 4, bw = (W - gap * (n - 1)) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label || ""}">`;
  if (opt.goal && max) { const y = top + bh - opt.goal / max * bh; s += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v, i) => {
    const x = i * (bw + gap);
    if (v == null || v === 0) s += `<rect class="empty" x="${x}" y="${top + bh - 2}" width="${bw}" height="2" rx="1"/>`;
    else { const h = Math.max(3, v / max * bh); s += `<rect class="b ${opt.cls ? opt.cls(v) : ""}" x="${x}" y="${top + bh - h}" width="${bw}" height="${h}" rx="2"><title>${opt.fmt ? opt.fmt(v, i) : v}</title></rect>`; }
    if (opt.labels && (i % 2 === (n - 1) % 2)) s += `<text class="lbl" x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${opt.labels[i]}</text>`;
  });
  return s + "</svg>";
}

  const night = m === "midnight" || (m === "time" && isEvening()) || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = night ? "midnight" : "dawn";
  document.getElementById("themeColor").setAttribute("content", night ? "#241726" : "#fff6f8");
}
function render() {
  applyTheme();
  renderTabs();

const P = id => S.projects.find(p => p.id === id);
function download(name, obj) {
  const b = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;

  const a = el.dataset.a, id = el.dataset.id, d = day();
  switch (a) {
    case "tab": tab = el.dataset.k; window.scrollTo(0, 0); break;
    case "t3fill": {
      const cands = S.projects.filter(p => p.status === "focus").sort((x, y) => (x.deadline || "9").localeCompare(y.deadline || "9"))
        .map(p => { const s = p.steps.find(s => !s.done); return s ? `${p.title} — ${s.t}` : null; }).filter(Boolean);
      let added = 0;
      d.top3.forEach(x => { if (!x.t && cands.length) { const c = cands.shift(); if (!d.top3.some(y => y.t === c)) { x.t = c; added++; } } });

    case "ideaAdd": { const v = document.getElementById("ideaIn").value.trim(); if (!v) return; S.ideas.unshift({ id: uid(), t: v, date: TK() }); toast("냉동실에 넣었어요"); break; }
    case "ideaDel": S.ideas = S.ideas.filter(i => i.id !== id); break;

  switch (c) {
    case "t3done": d.top3[+el.dataset.i].done = el.checked; break;
    case "t3text": d.top3[+el.dataset.i].t = el.value.trim(); rerender = false; break;
    case "exMin": d.ex.min = el.value; if (+el.value > 0) d.ex.done = true; break;
    case "note": d.note = el.value; rerender = false; break;
    case "care": d.care = el.checked ? [...new Set([...d.care, id])] : d.care.filter(x => x !== id); rerender = false; break;
    case "step": { const s = P(el.dataset.p).steps.find(s => s.id === id); s.done = el.checked; break; }
    case "pf": { const p = P(el.dataset.p); p[el.dataset.f] = el.value; rerender = ["status", "deadline", "type"].includes(el.dataset.f); break; }
    case "choreT": S.chores.find(x => x.id === id).t = el.value; rerender = false; break;
    case "choreE": S.chores.find(x => x.id === id).every = Math.max(1, +el.value || 1); break;
    case "rv": { const k = isoWeek(new Date()); S.reviews[k] = S.reviews[k] || { good: "", stuck: "", next: "" }; S.reviews[k][el.dataset.f] = el.value; rerender = false; break; }
    case "set": S.settings[el.dataset.f] = +el.value || 0; rerender = false; break;
    case "rtT": S.routines.find(r => r.id === id).t = el.value; rerender = false; break;
    default: return;
  }
  save(); if (rerender) render();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const map = { ideaIn: "ideaAdd", wC: "wAdd", npT: "pAdd", ncT: "choreAdd", nrT: "rtAdd" };
  const t = e.target; let act = map[t.id];
  if (!act && t.id && t.id.startsWith("st_")) { document.querySelector(`[data-a=stepAdd][data-p="${t.id.slice(3)}"]`)?.click(); return; }
  if (act) { e.preventDefault(); document.querySelector(`[data-a=${act}]`)?.click(); }
});

document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!o.projects || !o.days) throw 0; if (!confirm("지금 기록을 이 파일로 바꿀까요?")) return; localStorage.setItem(LS, JSON.stringify(o)); load(); save(); render(); toast("복원했어요"); }
    catch (err) { toast("SOL MANAGER 백업 파일이 아니에요"); } };
  r.readAsText(f); e.target.value = "";
});

// 날짜가 바뀌거나 앱으로 돌아오면 다시 그림
let lastKey = TK();
document.addEventListener("visibilitychange", () => { if (!document.hidden && tab === "today") { lastKey = TK(); render(); } });
setInterval(() => { if (TK() !== lastKey) { lastKey = TK(); render(); } }, 60000);

load(); save(); render();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
