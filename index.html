<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="description" content="1인 기업·프리랜서를 위한 생활 & 업무 매니저">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOL MANAGER">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SOL MANAGER</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE5; --ink:#1D1B18; --ink-2:#5E5A53; --ink-3:#8F8A81;
  --line:#E2DED5; --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E6ECFD;
  --ok:#2E8B57; --ok-soft:#E3F2E8; --warn:#B8650F; --warn-soft:#FBEEDD; --bad:#C8443A; --bad-soft:#FBE6E3;
  --shadow:0 1px 2px rgba(30,25,15,.05),0 4px 14px rgba(30,25,15,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1D1C1A; --surface-2:#272623; --ink:#EDEBE6; --ink-2:#B3AFA7; --ink-3:#7D7970;
    --line:#34322E; --accent:#7D9BFF; --accent-ink:#0F1220; --accent-soft:#222A45;
    --ok:#5CC18A; --ok-soft:#1C3026; --warn:#E5A04F; --warn-soft:#352717; --bad:#EF7A70; --bad-soft:#3A1F1C;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1D1C1A; --surface-2:#272623; --ink:#EDEBE6; --ink-2:#B3AFA7; --ink-3:#7D7970;
  --line:#34322E; --accent:#7D9BFF; --accent-ink:#0F1220; --accent-soft:#222A45;
  --ok:#5CC18A; --ok-soft:#1C3026; --warn:#E5A04F; --warn-soft:#352717; --bad:#EF7A70; --bad-soft:#3A1F1C;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:16px 16px 24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--ink-3);font-size:13px}
.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .hint{font-weight:500;color:var(--ink-3);font-size:12px}
.muted{color:var(--ink-3);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-bottom:0}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:64px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--surface-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);padding:6px 8px}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.check{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--ink-3);border-radius:7px;display:grid;place-items:center;cursor:pointer;margin:0;background:transparent}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t3 input[type=text]{background:transparent;padding:8px 4px;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.t3 .done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.t3 .row{margin-bottom:4px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.toggle{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--line);background:transparent;font-weight:600;color:var(--ink-2);cursor:pointer}
.toggle.on{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.moods button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.moods button b{font-size:17px}
.moods button span{font-size:11px;color:var(--ink-3)}
.moods button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.moods button.on span{color:inherit;opacity:.85}
.care{border-color:var(--warn);background:var(--warn-soft)}
.care h2{color:var(--warn)}
.care .item{display:flex;align-items:center;gap:10px;padding:7px 0}
.dstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dcard{flex:none;min-width:150px;max-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dcard .d{font-size:20px;font-weight:700}
.dcard .t{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard.hot{border-color:var(--bad)}
.dcard.hot .d{color:var(--bad)}
.list .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.proj{cursor:pointer}
.proj .ttl{font-weight:600}
.proj .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pbody{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);cursor:default}
.pbody label{display:block;font-size:12px;color:var(--ink-3);margin:10px 0 4px}
.group-h{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin:18px 2px 8px;display:flex;justify-content:space-between}
.banner{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:20px;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .b{fill:var(--accent)}
svg.chart .b.low{fill:var(--warn)}
svg.chart .b.ok{fill:var(--ok)}
svg.chart .gl{stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1}
svg.chart .lbl{fill:var(--ink-3);font-size:9px;font-family:"IBM Plex Mono",monospace}
svg.chart .empty{fill:var(--line)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600}
.empty-note{color:var(--ink-3);font-size:13px;padding:6px 0}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* ===== SOL MANAGER — 저장은 localStorage 한 키(JSON 문서 S) ===== */
const LS = "solmanager.v1";
const OLD_LS = "solent.v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TK = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const between = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5); // b - a (일)
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return `${t.getUTCFullYear()}-W${pad(Math.ceil(((t - y0) / 864e5 + 1) / 7))}`;
}
function weekDays(ref) { // 월~일
  const d = parseD(ref); const off = (d.getDay() + 6) % 7; const mon = addDays(ref, -off);
  return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
}
const steps = arr => arr.map(t => ({ id: uid(), t, done: false }));

function seed() {
  return {
    v: 1,
    settings: { name: "SOL", writeGoal: 2000, wage: 0 },
    days: {},
    projects: [
      { id: uid(), title: "던전에도 근로기준법이 적용됩니다", type: "창작", status: "focus", deadline: "2026-11-08",
        goal: "대원 웹소설 공모전 제출 (현대 판타지)", note: "", steps: steps(["시놉시스 최종본 확정", "원고 퇴고", "제출 양식·분량 확인", "제출"]) },
      { id: uid(), title: "바다 밑 하루", type: "창작", status: "focus", deadline: "2026-11-08",
        goal: "SF스토리 공모전 AI영상 부문 제출 — 제출하면 영상 작업은 끝", note: "", steps: steps(["남은 컷 생성", "편집·자막·사운드", "최종 렌더", "제출"]) },
      { id: uid(), title: "현대로맨스 원고 (계약 출판사)", type: "창작", status: "next", deadline: "",
        goal: "출판사 원고 요청 대응", note: "남주: 컨벤션·MICE 업계 / 여주: 영어 통역 프리랜서", steps: steps(["인물·관계 설정", "시놉시스", "원고 집필", "출판사 제출"]) },
      { id: uid(), title: "나가주세요, 제발!", type: "창작", status: "next", deadline: "",
        goal: "25~30화 비축 → 플랫폼 연재·투베 도전 → 출판사 컨택, 선인세", note: "", steps: steps(["25화까지 비축", "30화까지 비축", "플랫폼 연재 시작", "투베 진입", "출판사 컨택"]) },
      { id: uid(), title: "브런치북 2막", type: "창작", status: "wait", deadline: "",
        goal: "공모전 제출 완료 · 2027년 2월 발표", note: "", steps: [] },
      { id: uid(), title: "캐릭터·브랜딩", type: "부업", status: "hold", deadline: "",
        goal: "후순위 — 웹소설 일정이 끝난 뒤 다시 보기", note: "부캉이 · 부산 개복치 · 브랜딩 스튜디오", steps: [] },
      { id: uid(), title: "그 외 AI 영상", type: "창작", status: "hold", deadline: "",
        goal: "당분간 제작하지 않음", note: "환영관 · 하와이 스낵바 등", steps: [] },
    ],
    chores: [
      { id: uid(), t: "방 청소", every: 7, last: "" },
      { id: uid(), t: "빨래", every: 4, last: "" },
      { id: uid(), t: "분리수거·쓰레기", every: 4, last: "" },
      { id: uid(), t: "장보기", every: 7, last: "" },
      { id: uid(), t: "침구 세탁", every: 14, last: "" },
      { id: uid(), t: "화장실 청소", every: 10, last: "" },
    ],
    routines: [
      { id: uid(), t: "밖에 나가서 10분 걷기" },
      { id: uid(), t: "샤워하고 옷 갈아입기" },
      { id: uid(), t: "물 한 컵, 끼니 한 번 제대로 먹기" },
      { id: uid(), t: "오늘 글은 메모 3줄만 — 그걸로 충분" },
      { id: uid(), t: "편한 사람에게 메시지 하나 보내기" },
      { id: uid(), t: "폰 내려놓고 일찍 눕기" },
    ],
    shifts: [], ideas: [], reviews: {},
  };
}

let S;
function load() {
  try { const raw = localStorage.getItem(LS); S = raw ? JSON.parse(raw) : seed(); }
  catch (e) { S = seed(); }
  const base = seed();
  for (const k of Object.keys(base)) if (S[k] === undefined) S[k] = base[k];
  S.settings = Object.assign({}, base.settings, S.settings);
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("저장 실패 — 백업을 내려받아 두세요"); } }
function day(k = TK()) {
  if (!S.days[k]) S.days[k] = { top3: [{ t: "", done: false }, { t: "", done: false }, { t: "", done: false }], ex: { done: false, min: "" }, mood: null, note: "", write: [], care: [] };
  return S.days[k];
}
const peek = k => S.days[k];
let toastT;
function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600); }

/* ===== 상태 ===== */
let tab = "today";
let openP = null;
const STATUS = { focus: "집중", next: "다음", wait: "결과 대기", hold: "보류", done: "완료" };
const STATUS_CHIP = { focus: "accent", next: "", wait: "ok", hold: "", done: "ok" };
const TYPES = ["창작", "본업", "부업", "생활", "외주"];
const MOOD = ["", "바닥", "가라앉음", "보통", "괜찮음", "좋음"];

function writeTotal(k) { const d = peek(k); return d ? d.write.reduce((a, w) => a + (+w.chars || 0), 0) : 0; }
function choreState(c) {
  if (!c.last) return { due: 0, label: "기록 없음", cls: "warn" };
  const left = c.every - between(c.last, TK());
  if (left < 0) return { due: left, label: `${-left}일 밀림`, cls: "bad" };
  if (left === 0) return { due: 0, label: "오늘", cls: "warn" };
  return { due: left, label: `${left}일 뒤`, cls: "" };
}
function ddLabel(dl) { const n = between(TK(), dl); return n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`; }
function shiftMin(s) { if (!s.in || !s.out) return 0; const [a, b] = s.in.split(":").map(Number), [c, d] = s.out.split(":").map(Number); let m = (c * 60 + d) - (a * 60 + b); if (m < 0) m += 1440; return m; }
const hm = m => `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}`;

/* ===== 탭 ===== */
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  projects: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>',
  life: '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  stats: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};
const TABS = [["today", "오늘"], ["projects", "프로젝트"], ["life", "생활"], ["stats", "기록"], ["settings", "설정"]];
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>

/* ===== 오늘 ===== */
function nowStatus() {
  const n = new Date(), wd = n.getDay(), h = n.getHours() + n.getMinutes() / 60;
  if (wd === 0 || wd === 6) return { t: "주말 · 알바 있는 날", c: "warn" };
  if (h < 9) return { t: "출근 전", c: "" };
  if (h < 18) return { t: "근무 중 · 회사 일 먼저", c: "accent" };
  return { t: "퇴근 후 · 글 쓰는 시간", c: "ok" };
}
function rToday() {

  const writeProjects = S.projects.filter(p => p.type === "창작" && (p.status === "focus" || p.status === "next"));

function lowStreak() {
  let c = 0; for (let i = 0; i < 14; i++) { const d = peek(addDays(TK(), -i)); if (d && d.mood && d.mood <= 2) c++; } return c;
}

/* ===== 기록 ===== */
function bars(vals, max, opt = {}) {
  const n = vals.length, W = 300, H = 92, top = 6, bh = 66, gap = 4, bw = (W - gap * (n - 1)) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label || ""}">`;
  if (opt.goal && max) { const y = top + bh - opt.goal / max * bh; s += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v, i) => {
    const x = i * (bw + gap);
    if (v == null || v === 0) s += `<rect class="empty" x="${x}" y="${top + bh - 2}" width="${bw}" height="2" rx="1"/>`;
    else { const h = Math.max(3, v / max * bh); s += `<rect class="b ${opt.cls ? opt.cls(v) : ""}" x="${x}" y="${top + bh - h}" width="${bw}" height="${h}" rx="2"><title>${opt.fmt ? opt.fmt(v, i) : v}</title></rect>`; }
    if (opt.labels && (i % 2 === (n - 1) % 2)) s += `<text class="lbl" x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${opt.labels[i]}</text>`;
  });
  return s + "</svg>";
}
function rStats() {
  const days = Array.from({ length: 14 }, (_, i) => addDays(TK(), i - 13));
  const labels = days.map(d => String(+d.slice(8)));
  const moods = days.map(k => peek(k)?.mood || null);
  const writes = days.map(writeTotal);
  const goal = +S.settings.writeGoal || 0;
  const wk = weekDays(TK());
  const wWrite = wk.reduce((a, k) => a + writeTotal(k), 0);
  const wEx = wk.filter(k => peek(k)?.ex?.done).length;
  const wm = wk.map(k => peek(k)?.mood).filter(Boolean);
  const wAlba = S.shifts.filter(s => wk.includes(s.date)).reduce((a, s) => a + shiftMin(s), 0);
  const wkey = isoWeek(new Date()), rv = S.reviews[wkey] || { good: "", stuck: "", next: "" };
  const past = Object.keys(S.reviews).filter(k => k !== wkey).sort().reverse();
  return `
  <header class="top"><div><div class="brand">SOL MANAGER</div><h1>기록</h1></div><span class="chip">이번 주 ${wk[0].slice(5).replace("-", "/")}–${wk[6].slice(5).replace("-", "/")}</span></header>
  <section class="card stats4">
    <div class="stat"><span class="k">글</span><span class="v num">${wWrite.toLocaleString()}자</span></div>
    <div class="stat"><span class="k">운동</span><span class="v num">${wEx}/7일</span></div>
    <div class="stat"><span class="k">기분 평균</span><span class="v num">${wm.length ? (wm.reduce((a, b) => a + b, 0) / wm.length).toFixed(1) : "–"}</span></div>
    <div class="stat"><span class="k">알바</span><span class="v num">${hm(wAlba)}</span></div>
  </section>
  <section class="card"><h2>기분 · 최근 14일 <span class="hint">주황 = 낮은 날</span></h2>
    ${bars(moods, 5, { labels, label: "기분 추이", cls: v => v <= 2 ? "low" : "", fmt: (v, i) => `${days[i]} · ${v} ${MOOD[v]}` })}</section>
  <section class="card"><h2>글자 수 · 최근 14일 <span class="hint">점선 = 목표</span></h2>
    ${bars(writes, Math.max(goal, ...writes, 1), { labels, goal, label: "글자 수 추이", cls: v => goal && v >= goal ? "ok" : "", fmt: (v, i) => `${days[i]} · ${v.toLocaleString()}자` })}</section>
  <section class="card">
    <h2>주간 회고 <span class="hint">일요일 밤 5분</span></h2>
    <label class="muted">잘 된 것</label><textarea data-c="rv" data-f="good">${esc(rv.good)}</textarea>
    <label class="muted">막힌 것</label><textarea data-c="rv" data-f="stuck">${esc(rv.stuck)}</textarea>
    <label class="muted">다음 주 딱 3개</label><textarea data-c="rv" data-f="next">${esc(rv.next)}</textarea>
    ${past.length ? `<details style="margin-top:10px"><summary>지난 회고 ${past.length}개</summary>${past.map(k => { const r = S.reviews[k];
      return `<div style="margin-top:10px"><div class="tag num">${k}</div>${["good", "stuck", "next"].filter(f => r[f]).map(f => `<div class="muted" style="margin-top:4px;white-space:pre-wrap"><b>${{ good: "잘 된 것", stuck: "막힌 것", next: "다음 주" }[f]}</b> ${esc(r[f])}</div>`).join("")}</div>`; }).join("")}</details>` : ""}
  </section>`;
}

    <h2>기본</h2>
    <div class="list">
      <div class="li"><span class="grow">하루 글쓰기 목표</span><input type="number" inputmode="numeric" data-c="set" data-f="writeGoal" value="${S.settings.writeGoal}" style="width:100px"><span class="muted">자</span></div>
      <div class="li"><span class="grow">알바 시급 <span class="muted">(예상 수입 계산용)</span></span><input type="number" inputmode="numeric" data-c="set" data-f="wage" value="${S.settings.wage || ""}" placeholder="0" style="width:100px"><span class="muted">원</span></div>
    </div>
  </section>
  <section class="card">
    <h2>기분 낮은 날 루틴 <span class="hint">기분 1~2점일 때 오늘 탭에 떠요</span></h2>
    <div class="list">${S.routines.map(r => `<div class="li"><input type="text" class="grow" data-c="rtT" data-id="${r.id}" value="${esc(r.t)}"><button class="btn ghost sm" data-a="rtDel" data-id="${r.id}" aria-label="삭제">✕</button></div>`).join("")}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="nrT" class="grow" placeholder="나한테 효과 있던 작은 행동"><button class="btn sm" data-a="rtAdd">추가</button></div>
  </section>
  <section class="card">
    <h2>백업</h2>
    <p class="muted" style="margin:0 0 10px">기록은 이 브라우저 안에만 있어요. 한 달에 한 번 내려받아 두세요.</p>
    <div class="row wrap"><button class="btn" data-a="export">JSON 내보내기</button><button class="btn" data-a="import">JSON으로 복원</button>
      ${hasOld ? `<button class="btn" data-a="oldExport">예전 SOL ENT 기록 받기</button>` : ""}</div>
  </section>
  <section class="card">
    <h2>초기화</h2>
    <button class="btn danger" data-a="reset">모든 기록 지우고 처음부터</button>
  </section>
  <p class="muted" style="text-align:center">SOL MANAGER · 1인 기업·프리랜서용 생활 & 업무 매니저</p>`;
}

/* ===== 렌더 ===== */
function render() {
  renderTabs();
  const R = { today: rToday, projects: rProjects, life: rLife, stats: rStats, settings: rSettings }[tab];
  document.getElementById("app").innerHTML = R();
}

/* ===== 이벤트 ===== */
const P = id => S.projects.find(p => p.id === id);
function download(name, obj) {
  const b = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "pOpen" && e.target.closest("[data-stop]") && !e.target.closest("button[data-a=pOpen]")) return;
  const a = el.dataset.a, id = el.dataset.id, d = day();
  switch (a) {
    case "tab": tab = el.dataset.k; window.scrollTo(0, 0); break;
    case "t3fill": {
      const cands = S.projects.filter(p => p.status === "focus").sort((x, y) => (x.deadline || "9").localeCompare(y.deadline || "9"))
        .map(p => { const s = p.steps.find(s => !s.done); return s ? `${p.title} — ${s.t}` : null; }).filter(Boolean);
      let added = 0;
      d.top3.forEach(x => { if (!x.t && cands.length) { const c = cands.shift(); if (!d.top3.some(y => y.t === c)) { x.t = c; added++; } } });
      toast(added ? `${added}개 채웠어요` : "빈 칸이 없거나 불러올 단계가 없어요"); break;
    }
    case "exToggle": d.ex.done = !d.ex.done; break;
    case "wAdd": {
      const c = +document.getElementById("wC").value; if (!c) { toast("글자 수를 넣어 주세요"); return; }
      d.write.push({ pid: document.getElementById("wP").value, chars: c }); toast(`+${c.toLocaleString()}자`); break;
    }
    case "wDel": d.write.splice(+el.dataset.i, 1); break;
    case "mood": { const m = +el.dataset.m; d.mood = d.mood === m ? null : m; break; }
    case "chore": { const c = S.chores.find(c => c.id === id); c.last = TK(); toast(`${c.t} 완료`); break; }
    case "shiftIn": { let s = S.shifts.find(s => s.date === TK()); if (!s) { s = { id: uid(), date: TK(), in: "", out: "" }; S.shifts.push(s); } s.in = nowHM(); s.out = ""; toast(`${s.in} 출근`); break; }
    case "shiftOut": { const s = S.shifts.find(s => s.date === TK()); if (s) { s.out = nowHM(); toast(`${s.out} 퇴근 · ${hm(shiftMin(s))}`); } break; }
    case "shiftAdd": { const dt = document.getElementById("nsD").value; if (!dt) return; S.shifts = S.shifts.filter(s => s.date !== dt);
      S.shifts.push({ id: uid(), date: dt, in: document.getElementById("nsI").value, out: document.getElementById("nsO").value }); break; }
    case "shiftDel": S.shifts = S.shifts.filter(s => s.id !== id); break;
    case "ideaAdd": { const v = document.getElementById("ideaIn").value.trim(); if (!v) return; S.ideas.unshift({ id: uid(), t: v, date: TK() }); toast("냉동실에 넣었어요"); break; }
    case "ideaDel": S.ideas = S.ideas.filter(i => i.id !== id); break;
    case "ideaPromote": { const i = S.ideas.find(i => i.id === id); const np = { id: uid(), title: i.t, type: "창작", status: "hold", deadline: "", goal: "", note: `냉동실에서 꺼냄 (${i.date})`, steps: [] };
      S.projects.push(np); S.ideas = S.ideas.filter(x => x.id !== id); openP = np.id; toast("보류 상태로 꺼냈어요"); break; }
    case "pNewToggle": { const f = document.getElementById("pNew"); f.hidden = !f.hidden; if (!f.hidden) document.getElementById("npT").focus(); return; }
    case "pAdd": { const t = document.getElementById("npT").value.trim(); if (!t) { toast("이름을 넣어 주세요"); return; }
      const np = { id: uid(), title: t, type: document.getElementById("npType").value, status: document.getElementById("npS").value, deadline: document.getElementById("npD").value, goal: document.getElementById("npG").value.trim(), note: "", steps: [] };
      S.projects.push(np); openP = np.id; break; }
    case "pOpen": openP = openP === id ? null : id; break;
    case "pDel": if (!confirm("이 프로젝트를 삭제할까요?")) return; S.projects = S.projects.filter(p => p.id !== id); openP = null; break;
    case "stepAdd": { const inp = document.getElementById("st_" + el.dataset.p); const v = inp.value.trim(); if (!v) return; P(el.dataset.p).steps.push({ id: uid(), t: v, done: false }); break; }
    case "stepDel": { const p = P(el.dataset.p); p.steps = p.steps.filter(s => s.id !== id); break; }
    case "choreAdd": { const t = document.getElementById("ncT").value.trim(); if (!t) return; S.chores.push({ id: uid(), t, every: Math.max(1, +document.getElementById("ncE").value || 7), last: "" }); break; }
    case "choreDel": S.chores = S.chores.filter(c => c.id !== id); break;
    case "rtAdd": { const t = document.getElementById("nrT").value.trim(); if (!t) return; S.routines.push({ id: uid(), t }); break; }
    case "rtDel": S.routines = S.routines.filter(r => r.id !== id); break;
    case "export": download(`solmanager-${TK()}.json`, S); return;
    case "import": document.getElementById("importFile").click(); return;
    case "oldExport": try { download(`solent-old-${TK()}.json`, JSON.parse(localStorage.getItem(OLD_LS))); } catch (err) { toast("예전 기록을 읽지 못했어요"); } return;
    case "reset": if (!confirm("정말 모든 기록을 지울까요? 먼저 백업을 받아 두세요.")) return; S = seed(); toast("초기화했어요"); break;
    default: return;
  }
  save(); render();
});

document.addEventListener("change", e => {
  const el = e.target, c = el.dataset.c; if (!c) return;
  const d = day(), id = el.dataset.id; let rerender = true;
  switch (c) {
    case "t3done": d.top3[+el.dataset.i].done = el.checked; break;
    case "t3text": d.top3[+el.dataset.i].t = el.value.trim(); rerender = false; break;
    case "exMin": d.ex.min = el.value; if (+el.value > 0) d.ex.done = true; break;
    case "note": d.note = el.value; rerender = false; break;
    case "care": d.care = el.checked ? [...new Set([...d.care, id])] : d.care.filter(x => x !== id); rerender = false; break;
    case "step": { const s = P(el.dataset.p).steps.find(s => s.id === id); s.done = el.checked; break; }
    case "pf": { const p = P(el.dataset.p); p[el.dataset.f] = el.value; rerender = ["status", "deadline", "type"].includes(el.dataset.f); break; }
    case "choreT": S.chores.find(x => x.id === id).t = el.value; rerender = false; break;
    case "choreE": S.chores.find(x => x.id === id).every = Math.max(1, +el.value || 1); break;
    case "rv": { const k = isoWeek(new Date()); S.reviews[k] = S.reviews[k] || { good: "", stuck: "", next: "" }; S.reviews[k][el.dataset.f] = el.value; rerender = false; break; }
    case "set": S.settings[el.dataset.f] = +el.value || 0; rerender = false; break;
    case "rtT": S.routines.find(r => r.id === id).t = el.value; rerender = false; break;
    default: return;
  }
  save(); if (rerender) render();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const map = { ideaIn: "ideaAdd", wC: "wAdd", npT: "pAdd", ncT: "choreAdd", nrT: "rtAdd" };
  const t = e.target; let act = map[t.id];
  if (!act && t.id && t.id.startsWith("st_")) { document.querySelector(`[data-a=stepAdd][data-p="${t.id.slice(3)}"]`)?.click(); return; }
  if (act) { e.preventDefault(); document.querySelector(`[data-a=${act}]`)?.click(); }
});

document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!o.projects || !o.days) throw 0; if (!confirm("지금 기록을 이 파일로 바꿀까요?")) return; localStorage.setItem(LS, JSON.stringify(o)); load(); save(); render(); toast("복원했어요"); }
    catch (err) { toast("SOL MANAGER 백업 파일이 아니에요"); } };
  r.readAsText(f); e.target.value = "";
});

// 날짜가 바뀌거나 앱으로 돌아오면 다시 그림
let lastKey = TK();
document.addEventListener("visibilitychange", () => { if (!document.hidden && tab === "today") { lastKey = TK(); render(); } });
setInterval(() => { if (TK() !== lastKey) { lastKey = TK(); render(); } }, 60000);

load(); save(); render();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
